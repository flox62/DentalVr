<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #f0f0f0; --muted: #888;
      --on: #4ade80; --on-bg: rgba(74,222,128,0.12);
      --red: #f87171; --red-bg: rgba(248,113,113,0.12);
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 0 0 5rem;
    }
    header { width: 100%; padding: 3rem 1.5rem 1.5rem; text-align: center; }
    header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    header p  { margin-top: 0.4rem; font-size: 0.85rem; color: var(--muted); }
    .dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--on); margin-right: 6px; vertical-align: middle;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .env-wrap { width: 100%; max-width: 420px; padding: 0 1.25rem 1.25rem; }
    .env-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .env-select-wrap { position: relative; }
    .env-select-wrap::after {
      content: '▾'; position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 0.85rem;
    }
    select#env-select {
      width: 100%; background: var(--surface); border: 1px solid var(--border2);
      border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 500; padding: 0.75rem 2.5rem 0.75rem 1rem;
      appearance: none; cursor: pointer; outline: none; transition: border-color 0.2s;
    }

    .cards { width: 100%; max-width: 420px; padding: 0 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.25rem 1.5rem; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem; transition: border-color 0.2s;
    }
    .card.active { border-color: rgba(74,222,128,0.3); }
    .card-info { flex: 1; min-width: 0; }
    .card-label { font-size: 1rem; font-weight: 500; }
    .card-status { margin-top: 3px; font-size: 0.78rem; font-weight: 500; color: var(--muted); }
    .card.active .card-status { color: var(--on); }

    .toggle { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
    .toggle input { display: none; }
    .track {
      position: absolute; inset: 0; border-radius: 999px;
      background: var(--surface2); border: 1px solid var(--border);
      cursor: pointer; transition: background 0.25s, border-color 0.25s;
    }
    .thumb {
      position: absolute; top: 4px; left: 4px; width: 20px; height: 20px;
      border-radius: 50%; background: var(--muted);
      transition: transform 0.25s, background 0.25s; pointer-events: none;
    }
    .toggle input:checked ~ .track { background: var(--on-bg); border-color: var(--on); }
    .toggle input:checked ~ .track .thumb { transform: translateX(22px); background: var(--on); }
    .toggle.loading .track { opacity: 0.5; pointer-events: none; }
    .toggle.loading .thumb::after {
      content: ''; position: absolute; inset: 2px; border-radius: 50%;
      border: 2px solid transparent; border-top-color: var(--text);
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .version-badge {
      position: fixed; bottom: 1.2rem; right: 1.2rem;
      font-size: 0.68rem; color: var(--muted);
      background: var(--surface2); padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--border); letter-spacing: 0.05em;
    }

    .toast {
      position: fixed; bottom: 3.5rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 99px; padding: 0.6rem 1.2rem; font-size: 0.83rem; color: var(--text);
      transition: transform 0.3s, opacity 0.3s; opacity: 0; z-index: 100; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1><span class="dot"></span>Sheet Controls</h1>
  <p id="header-sub">Select an environment</p>
</header>

<div class="env-wrap">
  <div class="env-label">Environment</div>
  <div class="env-select-wrap">
    <select id="env-select" onchange="onEnvChange()">
      <option value="">— loading —</option>
    </select>
  </div>
</div>

<div class="cards">
  <div class="card" id="card-IsAES">
    <div class="card-info"><div class="card-label">IsAES</div><div class="card-status" id="status-IsAES">—</div></div>
    <label class="toggle" id="toggle-IsAES">
      <input type="checkbox" id="cb-IsAES" onchange="handleToggle('IsAES', this)" />
      <div class="track"><div class="thumb"></div></div>
    </label>
  </div>
  <div class="card" id="card-IsAutoclave">
    <div class="card-info"><div class="card-label">IsAutoclave</div><div class="card-status" id="status-IsAutoclave">—</div></div>
    <label class="toggle" id="toggle-IsAutoclave">
      <input type="checkbox" id="cb-IsAutoclave" onchange="handleToggle('IsAutoclave', this)" />
      <div class="track"><div class="thumb"></div></div>
    </label>
  </div>
</div>

<div class="version-badge">V2.1.0</div>
<div class="toast" id="toast"></div>

<script>
  // 1. PASTE YOUR WEB APP URL HERE:
  const API_URL = "https://script.google.com/macros/s/AKfycbzLm-vWTNQSEbErvGllYIlme7wO55814CNsYhgbGVQCCIzEGrCfl1VUBYwxMA-5hF7R3w/exec";
  
  const ROW_MAP = { IsAES: 1, IsAutoclave: 2 };
  const LS_SEL  = 'sheet_selected';
  let cachedEnvs = [];

  function getSelected()  { return localStorage.getItem(LS_SEL) || ''; }
  function setSelected(n) { localStorage.setItem(LS_SEL, n); }
  function getActiveSheet() {
    const env = cachedEnvs.find(e => e.name === getSelected());
    return env ? env.sheet : '';
  }

  async function fetchEnvironments() {
    try {
      const res = await fetch(`${API_URL}?action=getEnvs`);
      cachedEnvs = await res.json();
      renderDropdown();
    } catch (e) { showToast('Connection Error', 'error'); }
  }

  function renderDropdown() {
    const sel = document.getElementById('env-select');
    const saved = getSelected();
    sel.innerHTML = '<option value="">— select —</option>';
    cachedEnvs.forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.name; opt.textContent = e.name;
      if (e.name === saved) opt.selected = true;
      sel.appendChild(opt);
    });
    document.getElementById('header-sub').textContent = saved || 'Select an environment';
  }

  function onEnvChange() {
    const name = document.getElementById('env-select').value;
    setSelected(name);
    document.getElementById('header-sub').textContent = name || 'Select an environment';
    loadAll();
  }

  async function readRow(row) {
    const sheet = getActiveSheet();
    if (!sheet) return null;
    const res = await fetch(`${API_URL}?sheet=${encodeURIComponent(sheet)}&row=${row}&col=2`);
    return (await res.text()).trim().toUpperCase() === 'TRUE';
  }

  async function writeRow(row, value) {
    const sheet = getActiveSheet();
    await fetch(API_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `sheet=${encodeURIComponent(sheet)}&row=${row}&col=2&value=${value}`
    });
  }

  async function loadAll() {
    if (!getActiveSheet()) return;
    for (const [key, row] of Object.entries(ROW_MAP)) {
      document.getElementById('status-' + key).textContent = '...';
      try { setUI(key, await readRow(row)); } catch { }
    }
  }

  function setUI(key, val) {
    document.getElementById('cb-' + key).checked = val;
    document.getElementById('card-' + key).classList.toggle('active', val);
    document.getElementById('status-' + key).textContent = val ? 'Active' : 'Inactive';
  }

  async function handleToggle(key, cb) {
    const toggle = document.getElementById('toggle-' + key);
    const newVal = cb.checked;
    toggle.classList.add('loading'); cb.disabled = true;
    try {
      await writeRow(ROW_MAP[key], newVal);
      setUI(key, newVal);
    } catch { cb.checked = !newVal; } 
    finally { toggle.classList.remove('loading'); cb.disabled = false; }
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  fetchEnvironments().then(() => loadAll());
</script>
</body>
</html>
